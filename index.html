  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "NKENZO Sterling",
    "alternateName": "Eterling68",
    "birthDate": "2007",
    "nationality": "Congolaise",
    "jobTitle": "Footballer"
  }

<body>

  <!-- ============ GRAIN (texture film, superposé partout) ============ -->
  <div class="grain" aria-hidden="true"></div>

  <!-- ============ SYSTÈME/LANGUE ============ -->
  <header class="site-head">
    <a class="logo" href="#top" aria-label="Eterling68, retour en haut">ETERLING<b>68</b></a>
    <nav class="head-nav" aria-label="Navigation principale">
      <a href="#action" data-i18n="nav_action">Vidéos</a>
      <a href="#profil" data-i18n="nav_profil">Profil</a>
      <a href="#parcours" data-i18n="nav_parcours">Parcours</a>
      <a href="#contact" data-i18n="nav_contact">Contact</a>
    </nav>
    <button class="lang-toggle" id="langToggle" type="button" aria-label="Changer de langue">
      <span data-lang="fr" class="active-lang">FR</span><i>/</i><span data-lang="en">EN</span>
    </button>
  </header>

  <!-- ============ PRÉCHARGEUR : PILE OU FACE ============ -->
  <div class="toss-layer" id="toss" role="dialog" aria-label="Introduction, pile ou face">
    <div class="coin" id="coin">
      <span>68</span>
      <span>68</span>
    </div>
    <button class="toss-btn" id="tossBtn" type="button" data-i18n="toss_btn">Coup d'envoi</button>
    <p class="toss-hint" data-i18n="toss_hint">ou fais défiler</p>
  </div>

  <main id="top">

    <!-- ============ HERO ============ -->
    <section class="hero">
      <div class="hero-media">
        <video id="heroVideo" muted playsinline loop preload="metadata"
               poster="media/video/hero-street-poster.jpg"
               src="media/video/hero-street.mp4" aria-hidden="true"></video>
      </div>
      <!-- Ligne du coup d'envoi : se trace à la fin du préchargeur -->
      <svg class="kickoff-line" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <line x1="50" y1="0" x2="50" y2="100"/>
        <circle cx="50" cy="50" r="9"/>
      </svg>

      <div class="hero-copy">
        <h1 class="hero-name" aria-label="NKENZO STERLING"><span class="cut">NKENZO</span><span class="cut cut2">STERLING</span></h1>
      </div>
      <div class="hero-meta">
        <span>ETERLING68</span>
      </div>
    </section>

    <!-- ============ L'ACTION : PLANCHE CONTACT VIDÉO ============ -->
    <section class="action" id="action">
      <header class="sec-head">
        <h2 class="sec-title"><span data-i18n="action_title">Vidéos</span></h2>
      </header>
      <div class="film" id="filmGrid"><!-- clips injectés par main.js depuis player.json --></div>
    </section>

    <!-- ============ PROFIL : CARTE DE SCOUTING ============ -->
    <section class="profil" id="profil">
      <div class="scout-card" id="scoutCard">
        <span class="card-num" aria-hidden="true">68</span>
        <div class="card-photo">
          <img id="cardImg" src="media/img/img_sombre_small.webp"
               srcset="media/img/img_sombre_small.webp 560w, media/img/img_sombre_full.webp 960w"
               sizes="(min-width:900px) 40vw, 90vw"
               alt="Portrait en noir et blanc de NKENZO Sterling." loading="lazy" decoding="async">
        </div>
        <div class="card-data">
          <div class="card-top">
            <h2 class="card-name">NKENZO<br>STERLING</h2>
          </div>
          <dl class="stat-list" id="statList">
            <!-- lignes injectées depuis player.json -->
          </dl>
        </div>
      </div>
    </section>

    <!-- ============ SIX : RESPIRATION, LE NUMÉRO EN 3D ============ -->

      <div class="six-halo" aria-hidden="true"></div>

      </svg>
      <canvas class="six-canvas" aria-hidden="true"></canvas>
    </section>

    <!-- ============ PARCOURS : LE TERRAIN QUI SE TRACE ============ -->
    <section class="parcours" id="parcours">
      <svg class="pitch" viewBox="0 0 700 1100" preserveAspectRatio="xMidYMin meet" aria-hidden="true">
        <rect x="30" y="30" width="640" height="1040"/>
        <line x1="280" y1="30" x2="280" y2="1070"/>
        <line x1="30" y1="550" x2="670" y2="550"/>
        <circle cx="350" cy="550" r="80"/>
      </svg>
      <header class="sec-head">
        <h2 class="sec-title"><span data-i18n="parcours_title">Parcours</span></h2>
      </header>
      <ol class="pitch-steps" id="pitchSteps"><!-- étapes injectées --></ol>
    </section>

    <!-- ============ CONTACT ============ -->
    <section class="contact" id="contact">
      <h2 class="contact-title"><span class="rvl" data-i18n="contact_title">Contact</span></h2>
      <p class="contact-tell" data-i18n="contact_tell">Pour un essai ou un échange.</p>
      <p class="contact-number" id="contactNumber"></p>
      <p class="contact-manager" id="contactManager"></p>
      <div class="contact-actions" id="contactActions">
        <a class="cta contact-whatsapp" href="https://wa.me/242057612645" target="_blank" rel="noopener" data-i18n="cta_whatsapp">Écrire sur WhatsApp</a>
      </div>
      <p class="contact-more"><a href="contact.html" data-i18n="contact_sheet_link">Fiche contact complète</a></p>

    <footer class="site-foot">
      <p class="foot-name">NKENZO Sterling</p>
      <p>ETERLING68 · © <span id="year">2026</span> <span data-i18n="foot_rights">tous droits réservés</span></p>
    </footer>

  </main>

  <!-- ============ Libs motion (CDN) : GSAP + ScrollTrigger + Lenis. Le site reste lisible et navigable sans. ============ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js" defer></script>
  <noscript>
    <!-- sans JS : aucun écran de lancement, contenu visible directement -->
    <style>
      .toss-layer{ display:none !important; }
      .kickoff-line line, .kickoff-line circle{ stroke-dashoffset:0; }
      .hero-name .cut i{ transform:none !important; opacity:1 !important; }
      .js .film-frame, .js .pitch-steps li, .js .rvl{ opacity:1; transform:none; clip-path:none; }
      .film-frame video{ opacity:1; }
      .film-frame video[data-src]::after{ content:""; }
    </style>
  </noscript>
  <script src="js/main.js" defer></script>
  <script src="js/scene-six.js" defer></script>
